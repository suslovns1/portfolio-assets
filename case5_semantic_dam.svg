<rect x="118.0" y="804.0" width="3.5" height="56.0" rx="2" fill="#D97706" stroke="none" stroke-width="1"/>
<rect x="793.3" y="809.0" width="124.7" height="21.0" rx="10.5" fill="#FFFBEB" stroke="none" stroke-width="1"/>
