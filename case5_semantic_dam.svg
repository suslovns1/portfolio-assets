<text x="140.0" y="827.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Editor review</text>
<text x="140.0" y="854.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Low-confidence cuts are flagged on the timeline for the editor.</text>
