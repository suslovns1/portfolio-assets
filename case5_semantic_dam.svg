<text x="866.8" y="923.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#047857" text-anchor="middle" letter-spacing="1.4">DELIVERABLE</text>
<text x="140.0" y="927.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Handoff to the editor's NLE</text>
<text x="140.0" y="954.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">An editable sequence, delivered in the tool the editor already works in.</text>
