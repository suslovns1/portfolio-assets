<text x="608.9" y="1092.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B3D2E" text-anchor="start">Hundreds</text>
<text x="608.9" y="1112.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B8474" text-anchor="start">hypotheses per designer, per week</text>
<text x="44.0" y="1158.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8" text-anchor="start">Performance figures are presented as relative deltas under NDA.</text>
