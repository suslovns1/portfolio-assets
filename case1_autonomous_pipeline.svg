<rect x="469.8" y="717.0" width="91.9" height="20.0" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="515.8" y="731.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Batch render</text>
<text x="140.0" y="754.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" text-anchor="start">The whole variant matrix renders unattended — no designer present.</text>
<rect x="118.0" y="794.0" width="818.0" height="106.0" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
