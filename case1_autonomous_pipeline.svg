<text x="140.0" y="455.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Concept sign-off</text>
<text x="140.0" y="482.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">The art director approves the angle before a single generation credit is spent.</text>
