<text x="180.0" y="659.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Voice cast</text>
<rect x="227.9" y="645.0" width="85.9" height="20.0" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="270.9" y="659.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Score &amp; SFX</text>
<rect x="321.9" y="645.0" width="85.9" height="20.0" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="364.9" y="659.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Key visuals</text>
<rect x="415.8" y="645.0" width="91.9" height="20.0" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="461.8" y="659.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Motion shots</text>
<rect x="118.0" y="696.0" width="818.0" height="130.0" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
<rect x="118.0" y="708.0" width="3.5" height="106.0" rx="2" fill="#2563EB" stroke="none" stroke-width="1"/>
<rect x="830.5" y="713.0" width="87.5" height="21.0" rx="10.5" fill="#EFF6FF" stroke="none" stroke-width="1"/>
<text x="874.2" y="727.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="middle" letter-spacing="1.4">AUTOMATED</text>
<text x="140.0" y="731.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Automated assembly and render</text>
<text x="140.0" y="758.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Forced alignment turns the voiceover into a timing grid; shots snap to narration beats.</text>
<rect x="140.0" y="769.0" width="115.9" height="20.0" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="198.0" y="783.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Forced Alignment</text>
<rect x="263.9" y="769.0" width="68.0" height="20.0" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="297.9" y="783.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Captions</text>
<rect x="339.9" y="769.0" width="121.9" height="20.0" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="400.8" y="783.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Auto-ducked music</text>
<rect x="469.8" y="769.0" width="91.9" height="20.0" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="515.8" y="783.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Batch render</text>
<text x="140.0" y="806.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" text-anchor="start">The whole variant matrix renders unattended — no designer present.</text>
<rect x="118.0" y="846.0" width="818.0" height="106.0" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
<rect x="118.0" y="858.0" width="3.5" height="82.0" rx="2" fill="#D97706" stroke="none" stroke-width="1"/>
<rect x="793.3" y="863.0" width="124.7" height="21.0" rx="10.5" fill="#FFFBEB" stroke="none" stroke-width="1"/>
<text x="855.6" y="877.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#B45309" text-anchor="middle" letter-spacing="1.4">HUMAN DECISION</text>
<text x="140.0" y="881.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Side-by-side review</text>
<text x="140.0" y="908.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Brief next to the rendered cut: approve in one click, or send it back with notes.</text>
<text x="140.0" y="932.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" text-anchor="start">Revisions re-enter at step 2, so the manifest stays the single source of truth.</text>
<rect x="118.0" y="972.0" width="818.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
<rect x="118.0" y="984.0" width="3.5" height="56.0" rx="2" fill="#059669" stroke="none" stroke-width="1"/>
<rect x="815.6" y="989.0" width="102.4" height="21.0" rx="10.5" fill="#ECFDF5" stroke="none" stroke-width="1"/>
<text x="866.8" y="1003.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#047857" text-anchor="middle" letter-spacing="1.4">DELIVERABLE</text>
<text x="140.0" y="1007.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Creative pack</text>
<text x="140.0" y="1034.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Approved variants — plus an open, layered project file, never a black box.</text>
<rect x="44.0" y="1082.0" width="892.0" height="96.0" rx="10" fill="#F6FBF8" stroke="#CBE8DA" stroke-width="1.2"/>
<text x="68.0" y="1109.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#047857" text-anchor="start" letter-spacing="1.8">BUSINESS OUTCOME</text>
<text x="68.0" y="1144.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B3D2E" text-anchor="start">4 h → &lt; 3 min</text>
<text x="68.0" y="1164.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B8474" text-anchor="start">brief to first draft</text>
<rect x="286.6" y="1116.0" width="1.0" height="46.0" rx="0" fill="#CBE8DA" stroke="none" stroke-width="1"/>
<text x="348.3" y="1144.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B3D2E" text-anchor="start">−80%</text>
<text x="348.3" y="1164.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B8474" text-anchor="start">unit cost per concept</text>
<rect x="547.2" y="1116.0" width="1.0" height="46.0" rx="0" fill="#CBE8DA" stroke="none" stroke-width="1"/>
<text x="608.9" y="1144.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B3D2E" text-anchor="start">Hundreds</text>
<text x="608.9" y="1164.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B8474" text-anchor="start">hypotheses per designer, per week</text>
<text x="44.0" y="1210.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8" text-anchor="start">Performance figures are presented as relative deltas under NDA.</text>
