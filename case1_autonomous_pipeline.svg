<text x="140.0" y="555.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Parallel asset generation</text>
<text x="140.0" y="582.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Four independent queues run off one manifest, each under a hard cost ceiling.</text>
