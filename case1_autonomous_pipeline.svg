<rect x="815.6" y="937.0" width="102.4" height="21.0" rx="10.5" fill="#ECFDF5" stroke="none" stroke-width="1"/>
<text x="866.8" y="951.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#047857" text-anchor="middle" letter-spacing="1.4">DELIVERABLE</text>
<text x="140.0" y="955.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Creative pack</text>
<text x="140.0" y="982.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Approved variants — plus an open, layered project file, never a black box.</text>
