<text x="44.0" y="54.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="start" letter-spacing="2.2">CASE 01 · BINI GAMES · CREATIVE AUTOMATION</text>
<text x="44.0" y="88.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="700" fill="#0F172A" text-anchor="start">Autonomous AI Creative Engine</text>
<text x="44.0" y="114.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">From a campaign brief to a review-ready video pack. The designer directs; the pipeline produces.</text>
<rect x="44.0" y="134.0" width="892.0" height="1.0" rx="0" fill="#E2E8F0" stroke="none" stroke-width="1"/>
<rect x="118.0" y="170.0" width="818.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
<rect x="118.0" y="182.0" width="3.5" height="56.0" rx="2" fill="#94A3B8" stroke="none" stroke-width="1"/>
<rect x="860.2" y="187.0" width="57.8" height="21.0" rx="10.5" fill="#F1F5F9" stroke="none" stroke-width="1"/>
<text x="889.1" y="201.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1.4">INPUT</text>
<text x="140.0" y="205.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Campaign brief</text>
<text x="140.0" y="232.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Written by the art director: product, angle, target market, format and the winners to beat.</text>
<rect x="118.0" y="270.0" width="818.0" height="130.0" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
<rect x="118.0" y="282.0" width="3.5" height="106.0" rx="2" fill="#7C3AED" stroke="none" stroke-width="1"/>
<rect x="823.0" y="287.0" width="95.0" height="21.0" rx="10.5" fill="#F5F3FF" stroke="none" stroke-width="1"/>
<text x="870.5" y="301.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#6D28D9" text-anchor="middle" letter-spacing="1.4">AI SERVICE</text>
<text x="140.0" y="305.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Creative direction</text>
<text x="140.0" y="332.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">An LLM turns the brief into concept angles, a script and a shot-by-shot manifest.</text>
<rect x="140.0" y="343.0" width="121.9" height="20.0" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="201.0" y="357.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">LLM Orchestration</text>
<rect x="269.9" y="343.0" width="133.9" height="20.0" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="336.9" y="357.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Storyboard Manifest</text>
<text x="140.0" y="380.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" text-anchor="start">The manifest is the contract: every step downstream executes it, nothing is improvised.</text>
<rect x="118.0" y="420.0" width="818.0" height="132.0" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
<rect x="118.0" y="432.0" width="3.5" height="108.0" rx="2" fill="#D97706" stroke="none" stroke-width="1"/>
<rect x="793.3" y="437.0" width="124.7" height="21.0" rx="10.5" fill="#FFFBEB" stroke="none" stroke-width="1"/>
<text x="855.6" y="451.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#B45309" text-anchor="middle" letter-spacing="1.4">HUMAN DECISION</text>
<text x="140.0" y="455.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Concept sign-off</text>
<text x="140.0" y="482.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">The motion designer judges the angle before a single generation credit is spent.</text>
<rect x="140.0" y="496.0" width="64.3" height="18.0" rx="9" fill="#EFF6FF" stroke="none" stroke-width="1"/>
<text x="172.1" y="509.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">Approve</text>
<text x="216.3" y="510.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">The generation queues start.</text>
<rect x="140.0" y="522.0" width="102.2" height="18.0" rx="9" fill="#F1F5F9" stroke="none" stroke-width="1"/>
<text x="191.1" y="535.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Needs context</text>
<text x="254.2" y="536.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Back to the art director — a thin brief is answered, not generated around.</text>
<rect x="118.0" y="572.0" width="818.0" height="104.0" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
<rect x="118.0" y="584.0" width="3.5" height="80.0" rx="2" fill="#7C3AED" stroke="none" stroke-width="1"/>
<rect x="823.0" y="589.0" width="95.0" height="21.0" rx="10.5" fill="#F5F3FF" stroke="none" stroke-width="1"/>
<text x="870.5" y="603.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#6D28D9" text-anchor="middle" letter-spacing="1.4">AI SERVICE</text>
<text x="140.0" y="607.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Parallel asset generation</text>
<text x="140.0" y="634.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Four independent queues run off one manifest, each under a hard cost ceiling.</text>
