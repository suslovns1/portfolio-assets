<text x="140.0" y="829.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Side-by-side review</text>
<text x="140.0" y="856.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Brief next to the rendered cut: approve in one click, or send it back with notes.</text>
<text x="140.0" y="880.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" text-anchor="start">Revisions re-enter at step 2, so the manifest stays the single source of truth.</text>
