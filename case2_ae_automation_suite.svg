<text x="140.0" y="953.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Variation pack</text>
<text x="140.0" y="980.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Eight variations ready to test; three to ten packs go out on a normal production day.</text>
