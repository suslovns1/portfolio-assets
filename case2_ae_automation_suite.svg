<text x="140.0" y="853.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Designer review</text>
<text x="140.0" y="880.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Native, fully editable comps come back to the designer — automation never becomes a black box.</text>
