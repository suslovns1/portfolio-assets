<text x="44.0" y="54.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="start" letter-spacing="2.2">CASE 02 · STORYBY · IN-TOOL AUTOMATION</text>
<text x="44.0" y="88.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="700" fill="#0F172A" text-anchor="start">After Effects Creative Automation Suite</text>
<text x="44.0" y="114.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">A custom panel that removes the routine of comp assembly without taking the designer out of After Effects.</text>
<rect x="44.0" y="134.0" width="892.0" height="1.0" rx="0" fill="#E2E8F0" stroke="none" stroke-width="1"/>
<rect x="118.0" y="170.0" width="818.0" height="106.0" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
