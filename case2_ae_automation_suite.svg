<text x="140.0" y="481.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Automated comp build</text>
<text x="140.0" y="508.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Footage and hook layout, automatic overlay keying, approved copy from the production database.</text>
