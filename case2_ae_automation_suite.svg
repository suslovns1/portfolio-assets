<text x="44.0" y="1156.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8" text-anchor="start">Later superseded by Case 03, which rebuilt the same production logic outside After Effects. Performance figures are presented as relative deltas under NDA.</text>
