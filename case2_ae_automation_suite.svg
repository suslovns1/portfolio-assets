<text x="68.0" y="1090.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19.225315322038956" font-weight="700" fill="#0B3D2E" text-anchor="start">20–100 min → minutes</text>
<text x="68.0" y="1110.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B8474" text-anchor="start">to build one creative pack</text>
