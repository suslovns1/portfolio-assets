<text x="140.0" y="605.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Caption track</text>
<text x="140.0" y="632.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">The voice is isolated, aligned to the read, then animated word by word.</text>
