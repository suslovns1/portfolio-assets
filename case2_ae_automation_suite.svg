<rect x="860.2" y="187.0" width="57.8" height="21.0" rx="10.5" fill="#F1F5F9" stroke="none" stroke-width="1"/>
<text x="889.1" y="201.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1.4">INPUT</text>
<text x="140.0" y="205.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Creative code</text>
<text x="140.0" y="232.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">The composition name is the spec: film, scene, hook, on-screen copy, music.</text>
<text x="140.0" y="256.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" text-anchor="start">The trigger is the naming convention the studio already used — nothing new for the team to learn.</text>
<rect x="118.0" y="296.0" width="818.0" height="130.0" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
<rect x="118.0" y="308.0" width="3.5" height="106.0" rx="2" fill="#2563EB" stroke="none" stroke-width="1"/>
<rect x="830.5" y="313.0" width="87.5" height="21.0" rx="10.5" fill="#EFF6FF" stroke="none" stroke-width="1"/>
<text x="874.2" y="327.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="middle" letter-spacing="1.4">AUTOMATED</text>
<text x="140.0" y="331.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Parser and asset resolver</text>
<text x="140.0" y="358.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Decodes the code, resolves every asset from the library, repairs unreadable media.</text>
<rect x="140.0" y="369.0" width="103.9" height="20.0" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="192.0" y="383.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Naming grammar</text>
<rect x="251.9" y="369.0" width="74.0" height="20.0" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="288.9" y="383.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Auto-heal</text>
<rect x="333.9" y="369.0" width="115.9" height="20.0" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="391.8" y="383.5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Preflight report</text>
<text x="140.0" y="406.0" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" text-anchor="start">Real gaps are reported before the queue starts, instead of killing a render halfway through.</text>
